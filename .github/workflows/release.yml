name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          CURRENT_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREVIOUS_TAG=$(git tag --merged HEAD --sort=-version:refname \
            | grep -v "^${CURRENT_TAG}$" \
            | head -1)

          echo "## Changelog" > release_body.md
          echo "" >> release_body.md

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Initial release \`$CURRENT_TAG\`" >> release_body.md
          else
            echo "Changes since \`$PREVIOUS_TAG\`:" >> release_body.md
            echo "" >> release_body.md
            git log --pretty=format:"* %s (%h)" \
              "$PREVIOUS_TAG..$CURRENT_TAG" --no-merges >> release_body.md
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install rsrc
        if: matrix.goos == 'windows'
        run: go install github.com/akavel/rsrc@latest

      - name: Generate Windows resource
        if: matrix.goos == 'windows'
        run: |
          $(go env GOPATH)/bin/rsrc \
            -ico statics/sidecar.ico \
            -o rsrc_windows_amd64.syso
            
      - name: Build
        run: |
          mkdir -p dist
          EXT=""
          LDFLAGS="-s -w"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
            LDFLAGS="${LDFLAGS} -H=windowsgui"
          fi

          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -trimpath -ldflags="${LDFLAGS}" \
            -o dist/${{ github.event.repository.name }}-${{ matrix.goos }}-${{ matrix.goarch }}$EXT .

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release_body.md
          files: dist/*