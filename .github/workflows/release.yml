name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install rsrc
        if: matrix.goos == 'windows'
        run: go install github.com/akavel/rsrc@latest

      - name: Generate Windows resource
        if: matrix.goos == 'windows'
        run: |
          $(go env GOPATH)/bin/rsrc \
            -ico statics/sidecar.ico \
            -o rsrc_windows_amd64.syso
            
      - name: Build
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -o dist/${{github.event.repository.name}}-${{ matrix.goos }}-${{ matrix.goarch }}$EXT .

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name : ${{ github.event.inputs.tag || github.ref_name}}
          files: dist/*