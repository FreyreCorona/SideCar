name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Run tests (core package — internal)
        run: go test -v -race -count=1 ./core/...

      - name: Run tests (metrics package)
        run: go test -v -race -count=1 ./metrics/...

      - name: Run tests (root package — main)
        # The main package tests (detectMode, parseRegs, etc.) live in the root
        run: go test -v -race -count=1 -run "^Test" .

      - name: Run tests (tests/ black-box suite)
        run: go test -v -race -count=1 ./tests/...
